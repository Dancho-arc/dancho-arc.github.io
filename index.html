    grid-column: span 2 / span 2;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:h-\[380px\]{
    height: 380px;
  }

  .sm\:h-\[42px\]{
    height: 42px;
  }

  .sm\:w-auto{
    width: auto;
  }

  .sm\:flex-none{
    flex: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:px-7{
    padding-left: 1.75rem;
    padding-right: 1.75rem;
  }

  .sm\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:py-20{
    padding-top: 5rem;
    padding-bottom: 5rem;
  }

  .sm\:text-\[20px\]{
    font-size: 20px;
  }

  .sm\:text-\[56px\]{
    font-size: 56px;
  }

  .sm\:text-\[64px\]{
    font-size: 64px;
  }

  .sm\:text-\[72px\]{
    font-size: 72px;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-center{
    align-items: center;
  }

  .md\:justify-between{
    justify-content: space-between;
  }
}

@media (min-width: 1024px){
  .lg\:col-span-1{
    grid-column: span 1 / span 1;
  }

  .lg\:mx-0{
    margin-left: 0px;
    margin-right: 0px;
  }

  .lg\:flex{
    display: flex;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:h-\[400px\]{
    height: 400px;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-5{
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.15fr_\.85fr\]{
    grid-template-columns: 1.15fr .85fr;
  }

  .lg\:grid-cols-\[1\.2fr_\.8fr\]{
    grid-template-columns: 1.2fr .8fr;
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\]{
    grid-template-columns: 1.35fr .65fr;
  }

  .lg\:gap-4{
    gap: 1rem;
  }

  .lg\:py-20{
    padding-top: 5rem;
    padding-bottom: 5rem;
  }

  .lg\:py-24{
    padding-top: 6rem;
    padding-bottom: 6rem;
  }

  .lg\:pb-14{
    padding-bottom: 3.5rem;
  }

  .lg\:pt-14{
    padding-top: 3.5rem;
  }

  .lg\:text-left{
    text-align: left;
  }

  .lg\:text-\[88px\]{
    font-size: 88px;
  }

  .lg\:text-\[92px\]{
    font-size: 92px;
  }
}
